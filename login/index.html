<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Login · Karrar Enterprises</title>
  <meta name="description" content="Sign in to your Karrar Enterprises client portal.">
  <link rel="icon" type="image/png" href="/assets/karrar/favicon-black.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/media-updates.css">
  <link rel="stylesheet" href="/portal.css">
  <style>.auth-tabs[hidden]{display:none}</style>
</head>
<body class="portal-page">
  <header class="portal-header"><nav class="portal-nav shell"><a class="portal-brand" href="/"><img src="/assets/karrar/logo.png" alt="Karrar Enterprises"><span>Karrar Enterprises</span></a><div class="portal-actions"><a href="/">Back to Site</a><a class="button button-gold button-small" href="/book-a-call/">Book A Call</a></div></nav></header>
  <main class="portal-main"><div class="auth-shell">
    <div class="portal-heading"><p class="kicker">Client Portal</p><h1>Welcome Back</h1><p>Sign in to track your submitted projects and follow their progress.</p></div>
    <div class="portal-card auth-card">
      <div class="setup-notice" id="setupNotice" hidden>The secure client portal is awaiting its database connection.</div>
      <div class="auth-tabs"><button class="active" type="button" data-auth-tab="signin">Sign In</button><button type="button" data-auth-tab="signup">Create Account</button></div>
      <form class="auth-form" id="signinForm"><label class="portal-field"><span>Email</span><input id="signinEmail" type="email" autocomplete="email" required></label><label class="portal-field"><span>Password</span><input id="signinPassword" type="password" autocomplete="current-password" minlength="8" required></label><button class="button button-gold button-large" type="submit">Sign In</button><button class="portal-link-button" id="forgotPassword" type="button">Forgot password?</button></form>
      <form class="auth-form" id="signupForm" hidden><label class="portal-field"><span>Full Name</span><input id="signupName" autocomplete="name" required></label><label class="portal-field"><span>Company</span><input id="signupCompany" autocomplete="organization"></label><label class="portal-field"><span>Email</span><input id="signupEmail" type="email" autocomplete="email" required></label><label class="portal-field"><span>Password</span><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="button button-gold button-large" type="submit">Create Account</button></form>
      <form class="auth-form" id="resetForm" hidden><label class="portal-field"><span>New Password</span><input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="button button-gold button-large" type="submit">Update Password</button></form>
      <div class="social-auth" id="socialAuth"><div class="auth-divider"><span>or</span></div><button class="google-auth-button" id="googleSignIn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.7 4.7 0 0 1-2 3v2.5h3.3c1.9-1.8 2.9-4.4 2.9-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.5c-.9.6-2.1 1-3.4 1a5.9 5.9 0 0 1-5.5-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.5 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9.1L6.5 14Z"/><path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 3.1 7.5l3.4 2.6A5.9 5.9 0 0 1 12 6.1Z"/></svg><span>Continue with Google</span></button></div>
      <p class="portal-message" id="authMessage" role="status"></p>
    </div>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/portal-config.js"></script><script src="/portal.js"></script><script src="/login.js"></script><script defer src="/_vercel/insights/script.js"></script>
  <script src="/loader.js"></script>
</body>
</html>
