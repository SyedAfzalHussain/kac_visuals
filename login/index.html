<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Login · Karrar Enterprises</title><meta name="description" content="Sign in to your Karrar Enterprises client portal."><link rel="icon" type="image/png" href="/assets/karrar/favicon-black.png"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/media-updates.css"><link rel="stylesheet" href="/portal.css"><style>.auth-tabs[hidden]{display:none}</style></head><body class="portal-page">
<header class="portal-header"><nav class="portal-nav shell"><a class="portal-brand" href="/"><img src="/assets/karrar/logo.png" alt="Karrar Enterprises"><span>Karrar Enterprises</span></a><div class="portal-actions"><a href="/">Back to Site</a><a class="button button-gold button-small" href="/book-a-call/">Book A Call</a></div></nav></header>
<main class="portal-main"><div class="auth-shell"><div class="portal-heading"><p class="kicker">Client Portal</p><h1>Welcome Back</h1><p>Sign in to track your submitted projects and follow their progress.</p></div><div class="portal-card auth-card"><div class="setup-notice" id="setupNotice" hidden>The secure client portal is awaiting its database connection.</div><div class="auth-tabs"><button class="active" type="button" data-auth-tab="signin">Sign In</button><button type="button" data-auth-tab="signup">Create Account</button></div>
<form class="auth-form" id="signinForm"><label class="portal-field"><span>Email</span><input id="signinEmail" type="email" autocomplete="email" required></label><label class="portal-field"><span>Password</span><input id="signinPassword" type="password" autocomplete="current-password" minlength="8" required></label><button class="button button-gold button-large" type="submit">Sign In</button><button class="portal-link-button" id="forgotPassword" type="button">Forgot password?</button></form>
<form class="auth-form" id="signupForm" hidden><label class="portal-field"><span>Full Name</span><input id="signupName" autocomplete="name" required></label><label class="portal-field"><span>Company</span><input id="signupCompany" autocomplete="organization"></label><label class="portal-field"><span>Email</span><input id="signupEmail" type="email" autocomplete="email" required></label><label class="portal-field"><span>Password</span><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="button button-gold button-large" type="submit">Create Account</button></form><form class="auth-form" id="resetForm" hidden><label class="portal-field"><span>New Password</span><input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="button button-gold button-large" type="submit">Update Password</button></form><p class="portal-message" id="authMessage" role="status"></p></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/portal-config.js"></script><script src="/portal.js"></script><script src="/login.js"></script><script defer src="/_vercel/insights/script.js"></script></body></html>
